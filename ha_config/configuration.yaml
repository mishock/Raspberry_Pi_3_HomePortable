  - sensor:
      name: "Bybit account type"
      unique_id: bybit_account_type
      command: "cat /config/host_status/bybit_account_type.txt 2>/dev/null || echo —"
      scan_interval: 600
  - sensor:
      name: "Bybit settle currency"
      unique_id: bybit_settle_currency
      command: "cat /config/host_status/bybit_settle_currency.txt 2>/dev/null || echo USDT"
      scan_interval: 600
  - sensor:
      name: "Bybit trade markets"
      unique_id: bybit_trade_markets
      command: "cat /config/host_status/bybit_trade_markets.txt 2>/dev/null || echo —"
      scan_interval: 600
  - sensor:
      name: "Bybit main holding"
      unique_id: bybit_main_holding
      command: "cat /config/host_status/bybit_main_holding.txt 2>/dev/null || echo —"
      scan_interval: 600
  - sensor:
      name: "Bybit positions summary"
      unique_id: bybit_positions_summary
      command: "cat /config/host_status/bybit_positions_summary.txt 2>/dev/null || echo —"
      scan_interval: 600
  - sensor:
      name: "Bybit unrealised pnl"
      unique_id: bybit_unrealised_pnl
      command: "cat /config/host_status/bybit_unrealised_pnl.txt 2>/dev/null || echo 0"
      unit_of_measurement: "USD"
      device_class: monetary
      state_class: measurement
      value_template: "{{ value | float(0) }}"
      scan_interval: 600
  - sensor:
      name: "Bybit last sync"
      unique_id: bybit_last_sync
      command: "cat /config/host_status/bybit_last_sync.txt 2>/dev/null || echo —"
      scan_interval: 600
  - sensor:
      name: "Bybit asset 1"
      unique_id: bybit_asset_1
      command: "cat /config/host_status/bybit_asset_1.txt 2>/dev/null || echo —"
      scan_interval: 600
  - sensor:
      name: "Bybit asset 2"
      unique_id: bybit_asset_2
      command: "cat /config/host_status/bybit_asset_2.txt 2>/dev/null || echo —"
      scan_interval: 600
  - sensor:
      name: "Bybit asset 3"
      unique_id: bybit_asset_3
