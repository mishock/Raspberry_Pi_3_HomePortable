# Email-уведомления через Gmail SMTP (App Password из переменной окружения GMAIL_APP_PASSWORD).

input_number:
  garage_motion_sensitivity:
    name: "Чувствительность движения (гараж)"
    min: 1
    max: 10
    step: 1
    initial: 7
    mode: slider
    icon: mdi:tune-vertical
  garage_electric_meter:
    name: "Электросчётчик гаража"
    min: 0
    max: 999999
    step: 0.01
    mode: box
    unit_of_measurement: "kWh"
    icon: mdi:counter

input_boolean:
  garage_motion_enabled:
    name: "Детекция движения (гараж)"
    icon: mdi:motion-sensor
    initial: false

notify:
  - name: gmail
    platform: smtp
    server: smtp.gmail.com
    port: 587
    timeout: 15
    sender: mishock24@gmail.com
    encryption: starttls
    username: mishock24@gmail.com
    password: !env_var GMAIL_APP_PASSWORD
    recipient:
      - mishock24@gmail.com
    sender_name: "Pi3 HomeAssistant"

automation:
  # Ввод в поле «Текущие показания» (комп или телефон — одна и та же сущность) → CSV.
  - id: garage_electric_meter_ui_record
    alias: "Гараж: показания счётчика из UI → CSV"
    mode: queued
    trigger:
      - platform: state
        entity_id: input_number.garage_electric_meter
    condition:
      - condition: template
        value_template: >-
          {{ trigger.from_state is not none and trigger.to_state is not none
             and trigger.from_state.state not in ['unknown', 'unavailable']
             and trigger.to_state.state not in ['unknown', 'unavailable']
             and trigger.to_state.state != trigger.from_state.state
             and trigger.to_state.context.user_id is not none }}
    action:
      - service: shell_command.garage_meter_record_ui
        data:
          value: "{{ trigger.to_state.state }}"
        response_variable: rec
      - if:
          - condition: template
            value_template: "{{ rec.returncode != 0 }}"
        then:
          - service: input_number.set_value
            target:
              entity_id: input_number.garage_electric_meter
            data:
              value: "{{ states('sensor.garage_electric_meter') | float(0) }}"
          - service: persistent_notification.create
            data:
              title: "Счётчик гаража: показание не принято"
              message: "{{ trigger.to_state.state }} kWh — {{ rec.stderr }}"
      - service: homeassistant.update_entity
        target:
          entity_id:
            - sensor.garage_electric_meter
            - sensor.garage_electric_meter_delta
            - sensor.garage_electric_avg_daily
            - sensor.garage_electric_avg_monthly

  - id: garage_electric_meter_sync_on_start
    alias: "Гараж: счётчик ← CSV при старте"
    mode: single
    trigger:
      - platform: homeassistant
        event: start
    action:
      - delay: "00:00:30"
      - service: homeassistant.update_entity
        target:
          entity_id: sensor.garage_electric_meter
      - condition: template
        value_template: >-
          {{ states('sensor.garage_electric_meter') | float(0) > 0 and
             (states('sensor.garage_electric_meter') | float(0)
              - states('input_number.garage_electric_meter') | float(0)) | abs > 0.001 }}
      - service: input_number.set_value
        target:
          entity_id: input_number.garage_electric_meter
        data:
          value: "{{ states('sensor.garage_electric_meter') | float(0) }}"

  - id: garage_motion_sensitivity_sync
    alias: "Garage: порог чувствительности"
    mode: restart
    trigger:
      - platform: homeassistant
        event: start
      - platform: state
        entity_id: input_number.garage_motion_sensitivity
    action:
      - service: shell_command.garage_motion_sync_threshold


  - id: garage_motion_enabled_off_on_start
    alias: "Garage: детекция выкл при старте"
    mode: single
    trigger:
      - platform: homeassistant
        event: start
    action:
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.garage_motion_enabled

  - id: garage_motion_alert
    alias: "Garage: движение"
    description: "Сравнение снимков раз в минуту (cron на хосте)"
    mode: single
    trigger:
      - platform: state
        entity_id: binary_sensor.garage_motion
        from: "off"
        to: "on"
        for: "00:00:05"
    condition:
      - condition: state
        entity_id: input_boolean.garage_motion_enabled
        state: "on"
    action:
      - service: persistent_notification.create
        data:
          title: "Гараж: движение"
          message: "Изменение кадра Garage Camera."
      - service: notify.gmail
        data:
          title: "Гараж: движение"
          message: "Зафиксировано движение (сравнение снимков camera.garage_camera)."


# Lovelace: apexcharts для плавных графиков счётчика (2026-11-17)
lovelace:
  mode: storage
  resources:
    - url: /local/apexcharts-card.js?v=2.2.3
      type: module
  dashboards:
    ha-devtools:
      mode: yaml
      title: Инструменты
      icon: mdi:tools
      show_in_sidebar: true
      filename: dashboards/devtools.yaml
    timecapsule-media:
      mode: yaml
      title: Time Capsule
      icon: mdi:apple
      show_in_sidebar: true
      filename: dashboards/timecapsule.yaml
    pi3-monitor:
      mode: yaml
      title: Pi 3
      icon: mdi:raspberry-pi
      show_in_sidebar: true
      filename: dashboards/pi3.yaml
    jk-akb-4s-230:
      mode: yaml
      title: JK АКБ 4S 230Ah
      icon: mdi:battery-high
      show_in_sidebar: true
      filename: dashboards/jk-akb-4s-230.yaml

logger:
  default: warning
  logs:
    aiohomekit: debug
    homeassistant.components.homekit_controller: debug
